# This rule is not used by the project proton-secrets-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the proton.chiragsoni.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: proton-secrets-operator
    app.kubernetes.io/managed-by: kustomize
  name: protonsecret-editor-role
rules:
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets/status
  verbs:
  - get
