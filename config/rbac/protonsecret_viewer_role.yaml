# This rule is not used by the project proton-secrets-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to proton.chiragsoni.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: proton-secrets-operator
    app.kubernetes.io/managed-by: kustomize
  name: protonsecret-viewer-role
rules:
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets/status
  verbs:
  - get
