---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - get
  - patch
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets/finalizers
  verbs:
  - update
- apiGroups:
  - proton.chiragsoni.org
  resources:
  - protonsecrets/status
  verbs:
  - get
  - patch
  - update
