---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: protonsecrets.proton.chiragsoni.org
spec:
  group: proton.chiragsoni.org
  names:
    kind: ProtonSecret
    listKind: ProtonSecretList
    plural: protonsecrets
    shortNames:
    - psec
    singular: protonsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.lastSyncTime
      name: LastSync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProtonSecret is the Schema for the protonsecrets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ProtonSecret
            properties:
              data:
                description: data maps Secret keys to Proton Pass references.
                items:
                  description: DataSource maps one Secret key to a Proton Pass reference.
                  properties:
                    remoteRef:
                      description: 'remoteRef is a pass-cli secret reference: pass://VAULT/ITEM[/FIELD].'
                      pattern: ^pass://[^/]+/[^/]+(/[^/?]+)?(\?totp=(code|uri))?$
                      type: string
                    secretKey:
                      description: secretKey is the key in the resulting Secret.
                      maxLength: 253
                      pattern: ^[-._a-zA-Z0-9]+$
                      type: string
                  required:
                  - remoteRef
                  - secretKey
                  type: object
                maxItems: 100
                minItems: 1
                type: array
              refreshInterval:
                default: 1h
                description: refreshInterval is how often Proton Pass is re-read.
                  Minimum 1m.
                type: string
              rolloutTargets:
                description: rolloutTargets are restarted when the Secret data changes.
                items:
                  description: RolloutTarget names a workload to restart when the
                    Secret data changes.
                  properties:
                    kind:
                      description: kind of the workload.
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    name:
                      description: name of the workload, in the same namespace as
                        the ProtonSecret.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 20
                type: array
              suspend:
                description: suspend pauses reconciliation.
                type: boolean
              target:
                description: target describes the Secret to create.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: annotations added to the Secret.
                    type: object
                  creationPolicy:
                    default: Owner
                    description: creationPolicy controls adoption of pre-existing
                      Secrets.
                    enum:
                    - Owner
                    - Merge
                    - None
                    type: string
                  deletionPolicy:
                    default: Delete
                    description: deletionPolicy controls the Secret's fate when this
                      resource is deleted.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: labels added to the Secret.
                    type: object
                  name:
                    description: name of the Secret. Defaults to the ProtonSecret
                      name.
                    maxLength: 253
                    type: string
                  type:
                    default: Opaque
                    description: type of the Secret.
                    type: string
                type: object
            required:
            - data
            type: object
            x-kubernetes-validations:
            - message: secretKey values must be unique
              rule: self.data.all(d, self.data.exists_one(e, e.secretKey == d.secretKey))
          status:
            description: status defines the observed state of ProtonSecret
            properties:
              conditions:
                description: 'conditions: Ready and Synced.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncHash:
                description: lastSyncHash is a SHA-256 over the synced data (never
                  the values).
                type: string
              lastSyncTime:
                description: lastSyncTime is when the Secret was last verified against
                  Proton Pass.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the last spec generation processed.
                format: int64
                type: integer
              secretName:
                description: secretName is the name of the managed Secret.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
