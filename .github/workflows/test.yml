name: Tests

# Runs on its own for pull requests and pushes to other branches. On main/master and v* tags it runs only as part
# of release.yml (workflow_call), which publishes nothing unless this passes.
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
