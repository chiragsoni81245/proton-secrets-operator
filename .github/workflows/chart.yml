name: Chart
# Runs on its own for pull requests and pushes to other branches. On main/master and v* tags it runs only as part
# of release.yml (workflow_call), which publishes nothing unless this passes.
on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - 'charts/**'
      - 'config/crd/**'
      - 'api/**'
  pull_request:
    paths:
      - 'charts/**'
      - 'config/crd/**'
      - 'api/**'
  workflow_call:   # no path filter here: a release always checks the chart
permissions:
  contents: read
jobs:
  lint:
    name: Helm lint and CRD sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Chart CRD is in sync with API types
        run: |
          make chart-crd
          git diff --exit-code charts/proton-secrets-operator/templates/crd.yaml
      - run: make chart-lint
