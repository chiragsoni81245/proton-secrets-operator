name: Chart
# Required check for pull requests into main (ruleset on main: PR + these checks + up to date, no bypass), so
# every commit on main has passed it and release.yml does not run it again. workflow_dispatch = run by hand.
# No path filter: a required check that never reports would block every PR that doesn't touch the chart.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Helm lint and CRD sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Chart CRD is in sync with API types
        run: |
          make chart-crd
          git diff --exit-code charts/proton-secrets-operator/templates/crd.yaml
      - run: make chart-lint
