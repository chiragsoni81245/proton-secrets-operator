name: Release
# Tag vX.Y.Z  -> multi-arch operator image (:vX.Y.Z), pass-cli image, OCI Helm chart, all signed with cosign (keyless).
# Push to main/master -> multi-arch operator image only, tagged :latest and :sha-<short>, signed.
# pass-cli pin comes from repository variables (see hack/pass-cli-versions.md):
#   PASS_CLI_VERSION, PASS_CLI_URL_AMD64, PASS_CLI_SHA256_AMD64, PASS_CLI_URL_ARM64, PASS_CLI_SHA256_ARM64
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
permissions:
  contents: read
  packages: write
  id-token: write
env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the pass-cli pin is configured
        env:
          PASS_CLI_VERSION: ${{ vars.PASS_CLI_VERSION }}
          PASS_CLI_URL_AMD64: ${{ vars.PASS_CLI_URL_AMD64 }}
          PASS_CLI_SHA256_AMD64: ${{ vars.PASS_CLI_SHA256_AMD64 }}
          PASS_CLI_URL_ARM64: ${{ vars.PASS_CLI_URL_ARM64 }}
          PASS_CLI_SHA256_ARM64: ${{ vars.PASS_CLI_SHA256_ARM64 }}
        run: |
          missing=0
          for v in PASS_CLI_VERSION PASS_CLI_URL_AMD64 PASS_CLI_SHA256_AMD64 PASS_CLI_URL_ARM64 PASS_CLI_SHA256_ARM64; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Run hack/pass-cli-pin.sh, review the output and set the printed variables (see hack/pass-cli-versions.md)."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: azure/setup-helm@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Operator image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}
      - name: Operator image
        id: manager
        uses: docker/build-push-action@v6
        with:
          context: .
          target: manager
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,scope=manager,mode=max
          build-args: |
            PASS_CLI_VERSION=${{ vars.PASS_CLI_VERSION }}
            PASS_CLI_URL_AMD64=${{ vars.PASS_CLI_URL_AMD64 }}
            PASS_CLI_SHA256_AMD64=${{ vars.PASS_CLI_SHA256_AMD64 }}
            PASS_CLI_URL_ARM64=${{ vars.PASS_CLI_URL_ARM64 }}
            PASS_CLI_SHA256_ARM64=${{ vars.PASS_CLI_SHA256_ARM64 }}
      - name: pass-cli image
        id: passcli
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pass-cli-image
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/pass-cli:${{ vars.PASS_CLI_VERSION }}
          cache-from: type=gha,scope=pass-cli
          cache-to: type=gha,scope=pass-cli,mode=max
          build-args: |
            PASS_CLI_VERSION=${{ vars.PASS_CLI_VERSION }}
            PASS_CLI_URL_AMD64=${{ vars.PASS_CLI_URL_AMD64 }}
            PASS_CLI_SHA256_AMD64=${{ vars.PASS_CLI_SHA256_AMD64 }}
            PASS_CLI_URL_ARM64=${{ vars.PASS_CLI_URL_ARM64 }}
            PASS_CLI_SHA256_ARM64=${{ vars.PASS_CLI_SHA256_ARM64 }}
      - name: Sign operator image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.manager.outputs.digest }}
      - name: Sign pass-cli image
        if: github.ref_type == 'tag'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/pass-cli@${{ steps.passcli.outputs.digest }}
      - name: Package and push chart
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package charts/proton-secrets-operator --version "$v" --app-version "$v"
          helm push proton-secrets-operator-"$v".tgz oci://ghcr.io/${{ github.repository_owner }}/charts
