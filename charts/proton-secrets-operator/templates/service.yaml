{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pso.fullname" . }}-metrics
  labels: {{- include "pso.labels" . | nindent 4 }}
spec:
  selector: {{- include "pso.selectorLabels" . | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics}
{{- end }}
