{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pso.fullname" . }}
  labels: {{- include "pso.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "pso.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    - ports:   # DNS
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:   # Proton Pass (HTTPS) and the Kubernetes API server
        - port: 443
          protocol: TCP
        {{- range .Values.networkPolicy.apiServerPorts }}
        {{- if ne (int .) 443 }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
        {{- end }}
{{- end }}
